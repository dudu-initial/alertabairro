<text x="800.0" y="667" text-anchor="middle" fill="#17324A" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="600">9. Inicia e confirma</text>
<path d="M330 719 L548 719" fill="none" stroke="#087F88" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="445.0" y="711" text-anchor="middle" fill="#17324A" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="600">10. POST /transition</text>
<path d="M560 763 L788 763" fill="none" stroke="#087F88" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="680.0" y="755" text-anchor="middle" fill="#17324A" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="600">11. Autoriza a transição</text>
<path d="M800 807 L1028 807" fill="none" stroke="#087F88" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="920.0" y="799" text-anchor="middle" fill="#17324A" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="600">12. Estado + histórico</text>
<rect x="30" y="835" width="1600" height="35" rx="8" fill="#FCEAE5" stroke="#FCEAE5" stroke-width="1.5"/>
<text x="48" y="858" text-anchor="start" fill="#D46153" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="700">3  EMISSÃO E NOTIFICAÇÃO</text>
