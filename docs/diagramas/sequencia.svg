<text x="445.0" y="937" text-anchor="middle" fill="#17324A" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="600">14. POST /transition</text>
<path d="M800 989 L1508 989" fill="none" stroke="#D46153" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#coralArrow)"/>
<text x="1160.0" y="981" text-anchor="middle" fill="#17324A" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="600">15. Cria avisos internos</text>
<text x="830" y="1060" text-anchor="middle" fill="#61778A" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="600">O morador consulta os avisos em GET /api/notifications.</text>
