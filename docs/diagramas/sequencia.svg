<text x="920.0" y="390" text-anchor="middle" fill="#17324A" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="600">4. Calcula e persiste</text>
<path d="M1040 442 L572 442" fill="none" stroke="#087F88" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="800.0" y="434" text-anchor="middle" fill="#17324A" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="600">5. Retorna registro</text>
<path d="M560 486 L342 486" fill="none" stroke="#087F88" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="445.0" y="478" text-anchor="middle" fill="#17324A" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="600">6. 201 + ocorrência</text>
