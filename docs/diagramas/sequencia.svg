<text x="48" y="541" text-anchor="start" fill="#087F88" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="700">2  VALIDAÇÃO PELO AGENTE</text>
<path d="M1270 587 L342 587" fill="none" stroke="#087F88" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="800.0" y="579" text-anchor="middle" fill="#17324A" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="600">7. Consulta fila e detalhe</text>
